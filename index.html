<style>
:root{
  --bg:#111110; --bg2:#181716; --card:#1e1c1a; --line:#2e2a26;
  --bronze:#b48a55; --bronze2:#d2ab74; --text:#ece6dc; --muted:#a29a8e;
  --serif:'Playfair Display',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:.01em}
h2{font-size:clamp(26px,4vw,38px);margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze)}
.rule{width:56px;height:1px;background:var(--bronze);margin:14px 0 26px}
section{padding:72px 0;border-top:1px solid var(--line)}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(17,17,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.burger{width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px}
.burger span{height:1px;background:var(--text);display:block}
.logo{flex:1;text-decoration:none;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.logo img{height:28px;width:auto;margin-bottom:4px}
.flogo{width:min(300px,70vw);margin:0 auto 18px;opacity:.9}
.logo small{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--bronze)}
.langs{display:flex;gap:2px}
.langs button{font-size:12px;letter-spacing:.1em;padding:6px 7px;color:var(--muted)}
.langs button.on{color:var(--bronze2)}

/* search */
.sbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.sbar{display:none;border-top:1px solid var(--line);padding:10px 0}
.sbar.open{display:block}
.sbar .wrap{display:flex;gap:8px;align-items:center}
.sbar input{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:16px;padding:10px 14px;outline:none}
.sbar input:focus{border-color:var(--bronze)}
.sbar button{font-size:26px;color:var(--muted);width:36px}
.sbar input::-webkit-search-cancel-button{display:none}
.logo small{white-space:nowrap}
@media (max-width:420px){.logo small{letter-spacing:.14em;font-size:9px}.bar{gap:8px}.langs button{padding:6px 5px}}
.rest{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:24px}
.rest img{width:100%;height:auto;border:1px solid var(--line);cursor:zoom-in}
/* reviews + zoom */
.revs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.revs::-webkit-scrollbar{display:none}
.revs img{flex:0 0 auto;width:min(62vw,300px);height:auto;aspect-ratio:9/16;object-fit:contain;background:#0d0d0c;border:1px solid var(--line);scroll-snap-align:start;cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px}
.zoom.open{display:flex}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.zoom button{position:absolute;top:10px;right:14px;font-size:34px;color:#fff}
/* drawer */
.drawer{position:fixed;inset:0;z-index:40;visibility:hidden}
.drawer.open{visibility:visible}
.drawer .shade{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:.25s}
.drawer.open .shade{opacity:1}
.drawer nav{position:absolute;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:22px 24px 40px;transform:translateX(-100%);transition:.3s}
.drawer.open nav{transform:none}
.drawer h3{font-size:22px;margin-bottom:8px}
.drawer .g{margin-top:20px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze)}
.drawer a{display:block;text-decoration:none;padding:6px 0;color:var(--text);font-size:15px}
.drawer a:hover{color:var(--bronze2)}
.drawer .x{position:absolute;right:14px;top:14px;font-size:26px;color:var(--muted)}

/* hero */
.hero{padding:22px 0 24px;text-align:center;border:0}
.hero h1{font-size:clamp(17px,2.8vw,26px);letter-spacing:.04em;line-height:1.15;font-weight:400;color:#cdb38a}
.hero .sub{font-family:var(--sans);font-weight:300;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(13px,1.8vw,16px);color:var(--muted);margin-top:8px}
.carousel{position:relative;margin-top:18px}
.track{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(40vw,210px);min-width:0;overflow:hidden;scroll-snap-align:center;text-decoration:none;background:var(--card);border:1px solid var(--line)}
.slide img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#0d0d0c}
.slide p{padding:8px 10px;font-family:var(--serif);font-size:13px;line-height:1.3;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.single{justify-content:center}
.remark{max-width:760px;margin:24px auto 0;font-size:14px;color:var(--muted);border-left:1px solid var(--bronze);padding-left:18px;text-align:left}

/* process */
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.vid{aspect-ratio:9/14;background:var(--card);border:1px solid var(--line);display:flex;align-items:flex-end;padding:14px;font-size:14px;color:var(--muted)}
.pvids{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.pvids::-webkit-scrollbar{display:none}
.pstep{position:relative;margin:0;flex:0 0 min(40vw,210px);aspect-ratio:9/16;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.pstep img,.pstep video{width:100%;height:100%;object-fit:contain;background:#0d0d0c;display:block}
.pstep figcaption{position:absolute;left:0;right:0;bottom:0;padding:10px;font-size:13px !important;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:14px}
.pstep figcaption span{color:var(--bronze);margin-right:8px;font-family:var(--serif)}
.vid span{color:var(--bronze);margin-right:8px;font-family:var(--serif)}
.soon{border:1px dashed #4a433b !important}

/* catalog */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.tile{position:relative;text-decoration:none;background:#0d0d0c;border:1px solid var(--line);aspect-ratio:3/4;overflow:hidden;display:flex;align-items:flex-end}
.tile img{position:absolute;inset:0 0 64px 0;width:100%;height:calc(100% - 64px);object-fit:contain;opacity:.9;transition:.4s}
.tile:hover img{opacity:1}
.tile .cap{position:relative;width:100%;padding:18px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.tile .cap b{font-family:var(--serif);font-weight:500;font-size:16px;line-height:1.25;display:block}
.tile .cap small{color:var(--muted);font-size:12px}
.tile .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:64px;color:#2c2824}

/* lists */
.backbar{padding-top:18px}
.backbar + section{padding-top:22px}
.backbtn{font-size:14px;color:var(--bronze2);border:1px solid var(--line);padding:8px 14px;letter-spacing:.03em}
.backbtn:hover{border-color:var(--bronze)}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:12px}
.crumbs a{text-decoration:none;color:var(--bronze)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.chips a{text-decoration:none;font-size:13px;border:1px solid var(--line);padding:6px 12px}
.chips a:hover,.chips a.on{border-color:var(--bronze);color:var(--bronze2)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.it p{font-size:15px !important;line-height:1.3}
.it{text-decoration:none;background:var(--card);border:1px solid var(--line);position:relative}
.it img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#0d0d0c}
.it p{padding:12px 14px 4px;font-family:var(--serif);font-size:17px}
.it small{display:block;padding:0 14px 14px;color:var(--muted);font-size:13px}
.new{position:absolute;top:10px;left:10px;background:var(--bronze);color:#111;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px}
.empty{color:var(--muted);padding:30px 0}

/* item page */
.item{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start}
.gal img{width:100%;height:auto;max-height:85vh;object-fit:contain;background:#0d0d0c;border:1px solid var(--line)}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs img{width:72px;aspect-ratio:3/4;object-fit:contain;background:#0d0d0c;opacity:.6;cursor:pointer;border:1px solid var(--line)}
.thumbs img.on{opacity:1;border-color:var(--bronze)}
.item h1{font-size:clamp(30px,4vw,44px);line-height:1.15}
.spec{list-style:none;margin:22px 0;border-top:1px solid var(--line)}
.spec li{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.spec li em{display:block;font-style:normal;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.art{font-size:12px;letter-spacing:.16em;color:var(--bronze);margin-top:8px}
.desc{margin-top:14px;color:#cfc7bb;font-size:15px;line-height:1.6}
.price{font-family:var(--serif);font-size:26px;margin-top:8px}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:22px;background:var(--bronze);color:#111;text-decoration:none;padding:14px 26px;font-weight:600;font-size:15px;letter-spacing:.03em}
.btn:hover{background:var(--bronze2)}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--bronze)}

/* steps, gift */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;counter-reset:s}
.step{border:1px solid var(--line);padding:24px;background:var(--bg2)}
.step:before{counter-increment:s;content:counter(s);font-family:var(--serif);font-size:40px;color:var(--bronze);display:block;line-height:1;margin-bottom:12px}
.terms{margin-top:22px;color:var(--muted);font-size:15px}
.occ{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:26px}
.occ div{border-top:1px solid var(--bronze);padding-top:16px}
.occ h3{font-size:21px;margin-bottom:6px}
.occ p{color:var(--muted);font-size:15px}
.lead{font-size:18px;max-width:760px}
.about-grid{display:grid;grid-template-columns:1fr 340px;gap:40px;align-items:center}
.maister{width:100%;aspect-ratio:9/16;object-fit:cover;border:1px solid var(--line);background:#0d0d0c}
@media (max-width:760px){.about-grid{grid-template-columns:1fr;gap:24px}.maister{max-width:340px;margin:0 auto}}
.about p{max-width:760px;font-size:17px;margin-bottom:14px}

/* faq */
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{list-style:none;cursor:pointer;font-family:var(--serif);font-size:19px;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:'+';color:var(--bronze);font-family:var(--sans);font-size:22px;line-height:1}
.faq details[open] summary:after{content:'−'}
.faq details p{margin-top:12px;color:#cfc7bb;max-width:820px}
.faq .hl{border:1px solid var(--bronze);padding:18px 20px;margin-bottom:10px;background:linear-gradient(135deg,rgba(180,138,85,.10),transparent)}
.faq .hl summary{color:var(--bronze2)}
.faq .hl summary:before{content:'✦';margin-right:10px;color:var(--bronze)}
.faq .hl summary{justify-content:flex-start}
.faq .hl summary:after{margin-left:auto}

.ph-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:24px}
.ph-grid div{aspect-ratio:1;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#5a5249;font-size:13px;text-align:center;padding:10px}

/* contacts, footer */
.contacts{text-align:center}
.contacts .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:30px 0 40px;text-align:center;color:var(--muted);font-size:13px}

@media (max-width:760px){
  .item{grid-template-columns:1fr;gap:24px}
  section{padding:56px 0}
}
</style>
</head>

GROUPS.forEach(g => g.s.forEach(s => { if(!SECTIONS[s[0]]) SECTIONS[s[0]] = {id:s[0], n:s, groups:[]}; SECTIONS[s[0]].groups.push(g); }));

const isNew = i => { if(!i.isNew) return false; const d = (Date.now() - new Date(i.added)) / 864e5; return d <= 61; };

function itemCard(i){
  return `<a class="it" href="#item-${i.id}">${isNew(i)?`<span class="new">${t("newBadge")}</span>`:""}
   <img src="${i.photos[0]}" alt="${esc(i.name[lang])}" loading="lazy"><p>${esc(i.name[lang])}</p><small>${i.art} · ${esc(i.metal[lang])}</small></a>`;
}

function photoGrid(list){
  return list.length?`<div class="ph-grid">${list.map(src=>`<div style="padding:0"><img src="${src}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:contain;background:#0d0d0c"></div>`).join("")}</div>`:"";
}

/* карусель: по черзі з різних груп, у кожній групі найновіші першими */
function mixHero(){
  const byGroup = {};
  ITEMS.filter(i=>i.hero).reverse().forEach(i=>{ const g = i.art.split("-")[0]; (byGroup[g] = byGroup[g] || []).push(i); });
  const order = ["KR","HN","OS","IK","SV","TN","PD","MS"];
  const queues = order.filter(g=>byGroup[g]).map(g=>byGroup[g]), out = [];
  while(queues.some(q=>q.length)) queues.forEach(q=>{ if(q.length) out.push(q.shift()); });
  return out;
}

  ${PROCESS_VIDEOS.length?`<section><div class="wrap">
    <h2>${t("processT")}</h2><div class="rule"></div>
    <div class="pvids">${PROCESS_VIDEOS.slice().sort((a,b)=>a.step-b.step).map(v=>`<figure class="pstep">${/\.(mp4|webm|mov)$/i.test(v.src)?`<video src="${v.src}" ${v.poster?`poster="${v.poster}"`:""} muted autoplay loop playsinline preload="metadata"></video>`:`<img src="${v.src}" alt="${t("process")[v.step]}" loading="lazy">`}<figcaption><span>${v.step+1}</span>${t("process")[v.step]}</figcaption></figure>`).join("")}</div>
  </div></section>`:""}

  <section id="catalog"><div class="wrap">
    <div class="eyebrow">01</div><h2>${t("catalogT")}</h2><div class="rule"></div>
    <div class="tiles">${GROUPS.map(g=>{const its=itemsInGroup(g);return `
      <a class="tile" href="#group-${g.id}">${its[0]?`<img src="${its[0].photos[0]}" alt="" loading="lazy">`:`<div class="ph">✦</div>`}
      <div class="cap"><b>${g.n[lang]}</b><small>${its.length} ${t("items")}</small></div></a>`}).join("")}
    </div>
  </div></section>

  ${news.length?`<section><div class="wrap"><h2>${t("newT")}</h2><div class="rule"></div><div class="items">${news.map(itemCard).join("")}</div></div></section>`:""}


  <section><div class="wrap">
    <div class="eyebrow">02</div><h2>${t("orderT")}</h2><div class="rule"></div>
    <div class="steps">${t("steps").map(s=>`<div class="step">${s}</div>`).join("")}</div>
    <p class="terms">${t("terms")}</p>
  </div></section>

  <section><div class="wrap">
    <h2>${t("giftT")}</h2><div class="rule"></div>
    <p class="lead">${t("giftLead")}</p>
    <div class="occ">${t("gifts").map(g=>`<div><h3>${g[0]}</h3><p>${g[1]}</p></div>`).join("")}</div>
  </div></section>

  <section class="about"><div class="wrap about-grid">
    <div><h2>${t("aboutT")}</h2><div class="rule"></div>
    ${t("about").map(p=>`<p>${p}</p>`).join("")}</div>
    <video class="maister" src="img/maister.mp4" poster="img/maister.jpg" muted autoplay loop playsinline preload="metadata"></video>
  </div></section>

  <section><div class="wrap">
    <h2>${t("restT")}</h2><div class="rule"></div><p class="lead">${t("rest")}</p>
    ${RESTORATION.length?`<div class="rest">${RESTORATION.map(src=>`<img src="${src}" alt="${t("restT")}" loading="lazy" data-zoom="${src}">`).join("")}</div>`:""}
  </div></section>

  ${REVIEWS.length?`<section><div class="wrap">
    <h2>${t("revT")}</h2><div class="rule"></div>
    <div class="revs">${REVIEWS.map(src=>`<img src="${src}" alt="${t("revT")}" loading="lazy" data-zoom="${src}">`).join("")}</div>
  </div></section>`:""}

  <section class="faq"><div class="wrap">
    <h2>${t("faqT")}</h2><div class="rule"></div>
    ${t("faq").map((f,k)=>`<details class="${k===0?"hl":""}"><summary>${f[0]}</summary><p>${f[1].replace("{link}",`<a href="${SILVER_LINK}" target="_blank" rel="noopener" style="color:var(--bronze2)">saranchuk-arts.com</a>`)}</p></details>`).join("")}
  </div></section>

  ${contacts()}

  ${INSTA_PHOTOS.length?`<section><div class="wrap">
    <h2>Instagram</h2><div class="rule"></div>${photoGrid(INSTA_PHOTOS)}
  </div></section>`:""}`;
}

function contacts(){
  return `<section class="contacts" id="contacts"><div class="wrap">
    <h2>${t("contactsT")}</h2><div class="rule" style="margin:14px auto 26px"></div>
    <div class="row">
      <a class="btn" href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">WhatsApp</a>
      ${TELEGRAM?`<a class="btn ghost" href="https://t.me/${TELEGRAM}" target="_blank" rel="noopener">Telegram</a>`:""}
      <a class="btn ghost" href="https://instagram.com/${INSTAGRAM}" target="_blank" rel="noopener">Instagram</a>
    </div></div></section>`;
}

function groupPage(g, activeSec){
  const secs = g.s.map(s=>s[0]);
  const list = activeSec ? itemsIn(activeSec) : itemsInGroup(g);
  return `<section style="border:0"><div class="wrap">
    <div class="crumbs"><a href="#">${t("home")}</a> / ${activeSec?`<a href="#group-${g.id}">${g.n[lang]}</a>`:g.n[lang]}</div>
    <h2>${activeSec?secName(activeSec):g.n[lang]}</h2><div class="rule"></div>
    <div class="chips">${secs.map(s=>`<a class="${s===activeSec?"on":""}" href="#section-${s}">${secName(s)}</a>`).join("")}</div>
    ${list.length?`<div class="items">${list.map(itemCard).join("")}</div>`:`<p class="empty">${t("empty")}</p>`}
  </div></section>${contacts()}`;
}

function itemPage(i){
  const sec = SECTIONS[i.section], g = sec.groups[0];
  const url = location.href.split("#")[0] + "#item-" + i.id;
  const wa = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(t("wa")(i.name[lang]+" ("+i.art+")", url))}`;
  const price = i.price ? `${t("priceFrom")} ${i.price.toLocaleString("uk-UA")} грн` : t("priceOnReq");
  return `<section style="border:0"><div class="wrap">
    <div class="crumbs"><a href="#">${t("home")}</a> / <a href="#group-${g.id}">${g.n[lang]}</a> / <a href="#section-${sec.id}">${secName(sec.id)}</a></div>
    <div class="item">
      <div class="gal"><img id="big" src="${i.photos[0]}" alt="${esc(i.name[lang])}">
        ${i.photos.length>1?`<div class="thumbs">${i.photos.map((p,k)=>`<img src="${p}" class="${k?"":"on"}" data-p="${p}" alt="">`).join("")}</div>`:""}
      </div>
      <div>
        ${isNew(i)?`<div class="eyebrow">${t("newBadge")}</div>`:""}
        <h1>${esc(i.name[lang])}</h1>
        <div class="art">${t("fArt")}: ${i.art}</div>
        ${i.desc?`<p class="desc">${esc(i.desc[lang])}</p>`:""}
        <ul class="spec">
          <li><em>${t("fMetal")}</em>${esc(i.metal[lang])}</li>
          ${i.image?`<li><em>${t("fImage")}</em>${esc(i.image[lang])}</li>`:""}
          ${i.stones?`<li><em>${t("fStones")}</em>${esc(i.stones[lang])}</li>`:""}
          ${i.base?`<li><em>${t("fBase")}</em>${esc(i.base[lang])}</li>`:""}
          ${i.size?`<li><em>${t("fSize")}</em>${esc(i.size[lang])}</li>`:""}
          ${i.options?`<li><em>${t("fOptions")}</em>${esc(i.options[lang])}</li>`:""}
        </ul>
        <div class="price">${price}</div>
        <p class="note">${t("priceNote")}</p>
        <a class="btn" href="${wa}" target="_blank" rel="noopener">${t("ask")}</a>
      </div>
    </div>
  </div></section>`;
}

function norm(x){ return String(x).toLowerCase().replace(/[’'ʼ`«»"“”„-]/g," ").replace(/\s+/g," ").trim(); }
function searchItems(q){
  const words = norm(q).split(" ").filter(Boolean);
  if(!words.length) return [];
  return ITEMS.filter(i=>{
    const sec = SECTIONS[i.section].n;
    const hay = norm([i.art, i.art.replace("-",""), i.name.uk,i.name.en,i.name.ro, sec[1],sec[2],sec[3],
      i.metal.uk,i.metal.en,i.metal.ro, i.stones?Object.values(i.stones).join(" "):"" ].join(" "));
    return words.every(w=>hay.includes(w));
  });
}
function searchPage(q){
  const list = searchItems(q);
  return `<section style="border:0"><div class="wrap">
    <div class="crumbs"><a href="#">${t("home")}</a> / ${t("sRes")}</div>
    <h2>«${esc(q)}»</h2><div class="rule"></div>
    ${list.length?`<div class="items">${list.map(itemCard).join("")}</div>`:`<p class="empty">${t("sNone")}</p>`}
  </div></section>${contacts()}`;
}

function render(){
  document.documentElement.lang = lang === "uk" ? "uk" : lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("#logoImg").alt = t("logo"); $("#logoSub").textContent = t("logoSub");
  $("#langs").innerHTML = ["uk","en","ro"].map(l=>`<button class="${l===lang?"on":""}" data-l="${l}">${l==="uk"?"UA":l.toUpperCase()}</button>`).join("");
  $("#menuList").innerHTML = GROUPS.map(g=>`<div class="g">${g.n[lang]}</div>${g.s.map(s=>`<a href="#section-${s[0]}">${s[LI[lang]]}</a>`).join("")}`).join("");
  sinput.placeholder = t("sPh");
  $("#foot").innerHTML = `<img class="flogo" src="img/logo-full.png" alt="${t("logo")}">${t("copy")}`;

  const h = location.hash.slice(1);
  let html;
  if(h.startsWith("item-")){ const i = ITEMS.find(x=>x.id===h.slice(5)); html = i ? itemPage(i) : home(); }
  else if(h.startsWith("group-")){ const g = GROUPS.find(x=>x.id===h.slice(6)); html = g ? groupPage(g) : home(); }
  else if(h==="search" && searchQ){ html = searchPage(searchQ); }
  else if(h.startsWith("section-")){ const s = SECTIONS[h.slice(8)]; html = s ? groupPage(s.groups[0], s.id) : home(); }
  else html = home();
  const isHome = !h || h==="catalog" || h==="contacts";
  if(!isHome) html = `<div class="wrap backbar"><button class="backbtn" id="backbtn">← ${t("back")}</button></div>` + html;
  $("#app").innerHTML = html;
  const bb = $("#backbtn");
  if(bb) bb.onclick = ()=>{
    if(navStack.length > 1){ history.back(); return; }
    if(h.startsWith("item-")){ const i = ITEMS.find(x=>x.id===h.slice(5)); location.hash = i ? "section-"+i.section : ""; }
    else if(h.startsWith("section-")){ const s = SECTIONS[h.slice(8)]; location.hash = s ? "group-"+s.groups[0].id : ""; }
    else location.hash = "catalog";
  };
  if(h && h!=="catalog" && h!=="contacts") window.scrollTo(0,0);
  else if(h){ const el = document.getElementById(h); if(el) el.scrollIntoView(); }
  document.querySelectorAll(".thumbs img").forEach(im=>im.onclick=()=>{
    $("#big").src = im.dataset.p; document.querySelectorAll(".thumbs img").forEach(x=>x.classList.toggle("on",x===im));
  });
}

let searchQ = "";
const sbar = $("#sbar"), sinput = $("#sinput");
$("#sbtn").onclick = ()=>{ sbar.classList.toggle("open"); if(sbar.classList.contains("open")){ sinput.placeholder = t("sPh"); sinput.focus(); } };
$("#sclose").onclick = ()=>{ sbar.classList.remove("open"); sinput.value=""; if(location.hash==="#search") location.hash=""; };
let st;
sinput.addEventListener("input", ()=>{ clearTimeout(st); st = setTimeout(()=>{
  searchQ = sinput.value.trim();
  if(!searchQ){ if(location.hash==="#search") location.hash=""; return; }
  if(location.hash!=="#search") location.hash="search"; else render();
}, 250); });
sinput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); sinput.blur(); } });
$("#langs").addEventListener("click", e=>{ const l = e.target.dataset.l; if(!l) return; lang = l; try{localStorage.setItem("lang",l)}catch(e){} render(); });
const drawer = $("#drawer");
$("#burger").onclick = ()=>drawer.classList.add("open");
drawer.addEventListener("click", e=>{ if(e.target.dataset.close!==undefined || e.target.tagName==="A") drawer.classList.remove("open"); });
const navStack = [location.hash];
window.addEventListener("hashchange", ()=>{
  const cur = location.hash;
  if(navStack.length > 1 && navStack[navStack.length-2] === cur) navStack.pop(); else navStack.push(cur);
  render();
});
const zoom = $("#zoom");
document.addEventListener("click", e=>{ const z = e.target.dataset && e.target.dataset.zoom; if(z){ zoom.querySelector("img").src = z; zoom.classList.add("open"); } });
zoom.addEventListener("click", ()=>zoom.classList.remove("open"));
render();
</script>
</body>
</html>
